<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Lightning Casino</title>
  <meta name="theme-color" content="#080b18">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #080b18;
      --cyan: #00eaff;
      --purple: #8b5cf6;
      --text: #f4f7ff;
      --muted: #9ba7c7;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 24px;
      background:
        radial-gradient(ellipse at 20% 20%, #10234a 0%, transparent 45%),
        radial-gradient(ellipse at 80% 80%, #241044 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: "Rajdhani", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.16;
      background-image:
        linear-gradient(rgba(0, 234, 255, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 234, 255, 0.12) 1px, transparent 1px);
      background-size: 45px 45px;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 680px;
      padding: 55px 35px;
      text-align: center;
      border: 1px solid rgba(0, 234, 255, 0.2);
      border-radius: 24px;
      background: rgba(16, 22, 43, 0.85);
      box-shadow:
        0 0 60px rgba(0, 234, 255, 0.08),
        0 0 100px rgba(139, 92, 246, 0.08);
      backdrop-filter: blur(15px);
      animation: appear 0.7s ease-out;
    }

    .logo {
      margin-bottom: 40px;
      font-family: "Orbitron", sans-serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .logo span {
      color: var(--cyan);
      text-shadow: 0 0 15px rgba(0, 234, 255, 0.6);
    }

    .bolt {
      display: block;
      margin-bottom: 10px;
      color: var(--cyan);
      font-size: 55px;
      filter: drop-shadow(0 0 15px rgba(0, 234, 255, 0.7));
      animation: flicker 3s infinite;
    }

    .error-code {
      font-family: "Orbitron", sans-serif;
      font-size: clamp(100px, 22vw, 175px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -8px;
      background: linear-gradient(135deg, #00eaff 15%, #8b5cf6 85%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    h1 {
      margin-top: 20px;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(20px, 4vw, 29px);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .description {
      max-width: 420px;
      margin: 15px auto 30px;
      color: var(--muted);
      font-size: 19px;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 190px;
      padding: 14px 22px;
      border-radius: 9px;
      font-family: "Orbitron", sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-decoration: none;
      transition: 0.25s ease;
    }

    .btn-primary {
      background: var(--cyan);
      color: #080b18;
      box-shadow: 0 0 20px rgba(0, 234, 255, 0.2);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 30px rgba(0, 234, 255, 0.5);
    }

    .footer {
      margin-top: 40px;
      color: #65718f;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .footer a {
      color: var(--cyan);
      font-weight: 700;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .footer a:hover {
      text-shadow: 0 0 12px rgba(0, 234, 255, 0.7);
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes flicker {
      0%, 92%, 96%, 100% { opacity: 1; }
      94% { opacity: 0.5; }
    }

    @media (max-width: 480px) {
      .container {
        padding: 40px 20px;
      }

      .logo {
        font-size: 14px;
        letter-spacing: 2px;
      }

      .description {
        font-size: 17px;
      }

      .btn {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="logo">
      <span>⚡</span> Lightning Casino
    </div>

    <span class="bolt" aria-hidden="true">ϟ</span>

    <div class="error-code">404</div>

    <h1>PAGE NOT FOUND</h1>

    <p class="description">
      Looks like this page vanished in a flash.
      The page you're looking for doesn't exist or has been moved.
    </p>

    <div class="buttons">
      <a href="/" class="btn btn-primary">
        ← BACK TO HOME
      </a>
    </div>

    <div class="footer">
      POWERED BY
      <a href="https://mxservers.online" target="_blank" rel="noopener noreferrer">
        MXSERVERS
      </a>
    </div>

  </main>
</body>
</html>
